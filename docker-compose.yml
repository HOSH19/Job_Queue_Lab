services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobqueue
      POSTGRES_PASSWORD: jobqueue
      POSTGRES_DB: jobqueue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqueue -d jobqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://jobqueue:jobqueue@postgres:5432/jobqueue
      QUEUE_KEY: jobqueue:jobs
      DELAYED_KEY: jobqueue:delayed
      DLQ_KEY: jobqueue:dlq
      EVENTS_CHANNEL: jobqueue:events
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: python -m app.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://jobqueue:jobqueue@postgres:5432/jobqueue
      QUEUE_KEY: jobqueue:jobs
      DELAYED_KEY: jobqueue:delayed
      DLQ_KEY: jobqueue:dlq
      EVENTS_CHANNEL: jobqueue:events
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Scale competing consumers: docker compose up --scale worker=2

volumes:

  redis_data:
  postgres_data:
